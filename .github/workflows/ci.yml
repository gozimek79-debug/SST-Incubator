name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (pelna historia) - wymagane przez krok "Check
      # reports/status.json freshness" ponizej, ktory liczy dystans commitow
      # (git rev-list) miedzy commitem zapisanym w status.json a HEAD. Domyslny
      # plytki checkout (depth=1) nie zawieralby tego commita w historii.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # NAPRAWA CI (zdiagnozowane doswiadczalnie 2026-08-07): reports/status.json
      # nie byl aktualizowany od commita 661b92a (2026-08-03) - "Run tests" ponizej
      # padal na "pytest -q" (bare) z ModuleNotFoundError('clos_scientist'), bo bez
      # katalogu glownego w sys.path tests/conftest.py:19 ("import
      # clos_scientist.experiment") nie ladowal sie -> pytest exit code 4 (usage
      # error, PRZED zebraniem testow) -> wszystkie kroki po "Run tests" pomijane.
      # 6 pushy (661b92a..c5d1103, 4 dni) weszlo bez ijakiejkolwiek niezaleznej
      # weryfikacji CI - niewidoczne w panelu, bo "CI: success" w gornym pasku to
      # ostatni ZAPISANY status.json (sprzed 661b92a), nie biezacy stan brancha.
      #
      # Ten krok jest niezaleznym, jawnym trip-wire: sprawdza PRZED odpaleniem
      # testow, czy zacommitowany reports/status.json jest swiezy wzgledem HEAD -
      # licząc TYLKO commity BEZ "[skip ci]" (czyli wlasne auto-commity tego
      # joba sie nie licza). Przy zdrowym cyklu miedzy dwoma zapisami zawsze
      # siedzi dokladnie jeden taki auto-commit - liczenie WSZYSTKICH commitow
      # dawaloby gap=2 na KAZDYM zdrowym pushu (falszywy alarm co push).
      #
      # continue-on-error: CELOWO nieblokujace. Gdyby ten krok TWARDO przerywal
      # joba (exit 1 + brak continue-on-error), pierwsze uruchomienie po
      # wykryciu nieswiezosci zablokowaloby WLASNIE te kroki nizej (Run tests
      # -> Write reports/status.json), ktore jedyne moga ja naprawic - petla
      # bez wyjscia. continue-on-error pokazuje ten krok jako jawnie czerwony
      # (widoczny, nie do przeoczenia) ale POZWALA reszcie joba pojechac dalej
      # i sie samo-naprawic, gdy testy faktycznie przejda.
      - name: Check reports/status.json freshness
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          status_path = Path("reports/status.json")
          if not status_path.exists():
              print("reports/status.json nie istnieje jeszcze - pierwszy zapis, pomijam sprawdzenie swiezosci.")
              sys.exit(0)

          status = json.loads(status_path.read_text(encoding="utf-8"))
          recorded_commit = status.get("commit")
          if not recorded_commit:
              print("reports/status.json bez pola 'commit' - nie moge sprawdzic swiezosci, pomijam.")
              sys.exit(0)

          ancestor_check = subprocess.run(
              ["git", "merge-base", "--is-ancestor", recorded_commit, "HEAD"],
          )
          if ancestor_check.returncode != 0:
              print(
                  f"UWAGA: commit {recorded_commit} zapisany w status.json nie jest przodkiem HEAD "
                  "(przepisana historia?) - nie moge policzyc dystansu, pomijam sprawdzenie."
              )
              sys.exit(0)

          count = subprocess.run(
              ["git", "rev-list", "--count", "--invert-grep", "--fixed-strings",
               "--grep=[skip ci]", f"{recorded_commit}..HEAD"],
              capture_output=True, text=True, check=True,
          )
          gap = int(count.stdout.strip())
          print(
              f"reports/status.json zapisany dla commita {recorded_commit}; od tego czasu "
              f"{gap} realny(ch) (nie-[skip ci]) commit(ow) do HEAD wlacznie."
          )
          if gap > 1:
              print(
                  f"BLAD: reports/status.json jest nieaktualny o {gap} realnych commitow (> 1) - "
                  "co najmniej jeden wczesniejszy push nie zdolal go zaktualizowac w CI "
                  "(np. 'Run tests' padl, zanim doszlo do 'Write reports/status.json'). "
                  "Panel Badacza moze pokazywac przedawnione dane bez ostrzezenia. "
                  "Znajdz i napraw przyczyne nieudanych runow CI dla pominietych commitow - "
                  "ten krok przejdzie sam, gdy nastepny udany run zapisze swiezy status.json.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      # NAPRAWA CI (zgloszenie uzytkownika 2026-08-10): tests/test_pc_001_statistics.py
      # uzywa pytest.importorskip("scipy.stats") - scipy CELOWO nie jest w
      # requirements.txt (decyzja CTO: zaleznosc wylacznie testowa, patrz
      # requirements-dev.txt i docstring tego pliku testowego). Bez tego kroku
      # importorskip cicho pomijal 60 testow walidacji statystyki reguly
      # decyzyjnej PC-001 w CI (785 lokalnie -> 725 w CI, bez ostrzezenia).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest

      # NAPRAWA CI: "python -m pytest" (nie bare "pytest") - "python -m" dodaje
      # katalog biezacy do sys.path, czego bare "pytest" NIE robi. Bez tego
      # tests/conftest.py:19 ("import clos_scientist.experiment") nie ladowal
      # sie w CI (ModuleNotFoundError), mimo ze u kazdego, kto testowal lokalnie
      # przez "python -m pytest", dzialalo bez zarzutu - stad luka niewidoczna
      # przez 4 dni. Patrz komentarz przy kroku "Check reports/status.json
      # freshness" powyzej.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest_output.txt

      # NAPRAWA CI-01B (zgloszenie audytora 2026-08-11): "N passed" samo w sobie
      # nie odslania, gdy pytest.importorskip na poziomie modulu ukrywa caly
      # plik testowy jako jedna pozycja "1 skipped" (nie "60 skipped" - patrz
      # tests/test_pc_001_statistics.py). Niezalezny przebieg --collect-only
      # daje "ile testow pytest w ogole zobaczyl", do porownania z sama
      # (write_status.py). Osobny krok, PO "Run tests" (ktory juz gatekeeperuje
      # joba) - collect-only tu jest tylko zrodlem liczby, nie druga bramka.
      #
      # NAPRAWA CI-01C (zgloszenie audytora 2026-08-11): if: always() - kolekcja
      # (nie egzekucja) testow prawie zawsze sie udaje nawet gdy "Run tests"
      # padnie (np. strażnik scipy pada w TRAKCIE testu, nie przy imporcie
      # modulu - collect-only w ogole go nie uruchamia). Gdy mimo to padnie,
      # write_status.py (ponizej, tez always()) i tak dostanie szanse zapisac
      # collected: null -> status: unknown zamiast nigdy sie nie uruchomic.
      - name: Collect test count (for status.json cross-check)
        if: always()
        run: |
          set -o pipefail
          python -m pytest --collect-only -q | tee pytest_collect_output.txt

      - name: Validate publication provenance
        run: python scripts/validate_publication.py

      - name: Validate artifact/experiment consistency
        run: python scripts/validate_artifacts.py

      - name: Validate panel (no hardcoded metrics)
        run: python scripts/validate_panel.py

      - name: Validate observability (snapshot telemetry integrity)
        run: python scripts/validate_observability.py

      # GAP-VALIDATOR-CI (audyt P2, SPRINT v0.11.0, CTO 2026-07-27): istnial
      # od SPRINT_v0.11.0.md P1 (frozen bundles), ale nigdy nie byl wpiety do
      # CI - luka od poczatku tego mechanizmu.
      - name: Validate bundle freshness (frozen artifacts)
        run: python scripts/validate_bundle_freshness.py

      # GAP-STALENESS (P2 KROK 3, CTO 2026-07-27): docs/METRIC_STATUS_TABLE.md
      # (reczna proza+liczby, jedyny z trzech bez generatora),
      # competency_profile.json i rerun_full_report_v0_11_0.md musza sie
      # zgadzac z reports/population/population_validation_v0_11_0.json -
      # zamyka dokladnie ten rodzaj bledu, ktory kiedys spowodowal "Welch-pary
      # (0/253)" zamiast prawdziwych 69/253 dla Working Memory w tabeli.
      - name: Validate artifact freshness (staleness vs population_validation)
        run: python scripts/validate_artifact_freshness.py

      # Wpiecie walidatora Specyfikacji Kanonicznej PC-001 do CI jako brama zielonej
      # galezi (zadanie audytora §2.4, rekomendacja spec §8.1: ciagla weryfikacja
      # poprawnosci indeksu bije jednorazowe zamrozenie hashem - patrz uzasadnienie
      # w SPECYFIKACJA_KANONICZNA_PC_001.md §8.1 i docstring modulu).
      - name: Validate Canonical Spec PC-001 (address resolution, C-001, registry coverage)
        run: python -m scripts.validate_canonical_spec

      # Historia laboratorium CLOS (zlecenie uzytkownika, 2026-08-22; przepiete na
      # blokujace zleceniem B5-03; PRZESUNIETE PRZED "Write reports/status.json"
      # zleceniem B4C-05 v10 - POPRAWKA WLASNEGO BLEDU): reports/history.json jest
      # recznie utrzymywana kronika (proza dla zwyklego obserwatora) - bez sygnalu
      # automatycznego moze cicho rozjechac sie z rzeczywistym stanem prac (26 dni,
      # cztery kamienie milowe, zero wpisow, zero ostrzezenia - powod, dla ktorego
      # ten krok w ogole istnieje).
      #
      # ZNALEZISKO (B4C-05 v10, audyt CTO): gdy ten krok stal PO "Commit
      # status.json..." (jak w B5-03), bot zapisywal "ci-status(ok)" DLA
      # PRZEBIEGU, KTORY FAKTYCZNIE PADL na tym wlasnie kroku - bo w momencie
      # zapisu status.json ($JOB_STATUS = ${{ job.status }}) ten krok jeszcze
      # sie nie wykonal, wiec job.status widzialy przez "Write reports/status.json"
      # i "Commit status.json..." bylo wciaz "success". DOKLADNIE ten sam
      # mechanizm ciszy, ktory ta cala kontrola miala wykrywac, odtworzony
      # wlasna decyzja o kolejnosci krokow.
      #
      # UZASADNIENIE B5-03 ZA UMIESZCZENIEM NA KONCU BYLO BEZPODSTAWNE: mowilo,
      # ze krok na poczatku "zaglodzilby" samonaprawe status.json, przerywajac
      # joba przed jego zapisem. To zalozenie nie uwzglednialo, ze "Write
      # reports/status.json" i "Commit status.json..." JUZ MAJA if: always() -
      # wykonaja sie NIEZALEZNIE od tego, czy jakikolwiek wczesniejszy krok
      # (ten wlacznie) padnie. Zadnego glodzenia nie ma i nigdy nie bylo -
      # zalozenie nie zostalo sprawdzone przed wdrozeniem.
      #
      # KOLEJNOSC TERAZ: PRZED zapisem statusu, PO walidatorach. job.status
      # w momencie "Write reports/status.json"/"Commit status.json..." jest
      # JUZ "failure", jesli ten krok padnie - status.json i commit bota
      # poprawnie odzwierciedlaja PRAWDZIWY wynik calego joba, nie tylko
      # tego, co zdazylo sie wykonac przed nim.
      - name: Check reports/history.json freshness
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/validate_history_freshness.py

      # NAPRAWA CI-01C (zgloszenie audytora 2026-08-11): PRZED ta zmiana ten krok
      # (bez if:) byl pomijany, gdy "Run tests" LUB ktorykolwiek z siedmiu
      # walidatorow powyzej padl - czyli galaz compute_tests_status() == "red"
      # w write_status.py byla NIEOSIAGALNA w CI (job po prostu przerywal sie
      # wczesniej, status.json zostawal stary/zielony z poprzedniego udanego
      # runu - dokladnie ten sam rodzaj ciszy, ktory ta cala naprawa mial
      # usunac). if: always() - krok wykonuje sie TAKZE po niezerowym kodzie
      # kroku wczesniejszego. To NIE zamienia czerwonego joba w zielony (job
      # nadal konczy sie porazka - "Run tests"/walidator, ktory padl, nie ma
      # continue-on-error) - zmienia tylko to, czy ZDAZYMY zapisac, ze bylo
      # czerwono, zanim job sie zakonczy.
      #
      # JOB_STATUS=${{ job.status }}: "success" TYLKO gdy WSZYSTKIE kroki do
      # tego miejsca (Run tests + siedem walidatorow + kontrola swiezosci
      # kroniki) przeszly - dokladnie ta sama gwarancja, ktora wczesniej dawala
      # sama obecnosc w tym miejscu (patrz poprzedni komentarz, teraz
      # nieaktualny). Gdy job.status != success, write_status.py NIE moze juz
      # zakladac "OK" dla walidatorow (mogly nie zdazyc sie uruchomic, albo
      # jeden z nich faktycznie padl) - zapisuje "UNKNOWN", nie fabrykuje
      # zielonego.
      - name: Write reports/status.json
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python scripts/write_status.py pytest_output.txt reports/status.json pytest_collect_output.txt

      # NAPRAWA LIMITU API (zgloszenie uzytkownika): panel odkrywal dokumenty/
      # piloty/bundle listowaniem katalogow GitHub API z kazdej przegladarki
      # (~8 zapytan/ladowanie, limit 60/h bez autoryzacji wyczerpywany). Ten
      # sam wzorzec co reports/status.json powyzej - indeks generowany RAZ w
      # CI z listingu systemu plikow, panel czyta go przez raw fetch.
      - name: Write reports/artifacts_index.json
        run: python scripts/generate_artifacts_index.py reports/artifacts_index.json

      # Commituje reports/status.json i reports/artifacts_index.json z
      # powrotem do repo, zeby panel mogl je przeczytac przez
      # raw.githubusercontent.com (nie sa to efemeryczne artefakty CI). Tylko
      # na push (nie na pull_request z forkow, gdzie token jest
      # tylko-do-odczytu). [skip ci] w komunikacie zapobiega petli
      # push->CI->push.
      #
      # NAPRAWA CI-01C: always() dopisane SWIADOMIE, po rozwazeniu (zgloszenie
      # audytora, decyzja bez zgadywania). Bez tego "red" wyliczony przez
      # write_status.py powyzej istnialby WYLACZNIE w efemerycznym systemie
      # plikow zakonczonego joba - nigdy nie trafilby do repo, wiec nigdy do
      # panelu (ktory czyta status.json przez raw.githubusercontent, nie z
      # runnera CI) - caly ten mechanizm bylby martwym kodem. `git add`
      # dotyczy WYLACZNIE dwoch konkretnych plikow (nie `-A`/`.`) - zaden inny
      # brudny stan po nieudanym biegu (np. artefakty testowe) nie trafi do
      # commita. status.json/artifacts_index.json nie sa w CRITICAL_FILES_*
      # (generowane per-commit, nie zamrozone) - nie ma tu ryzyka hashowego.
      # D-036 (decyzja CTO 2026-08-12, zatwierdzenie commit-backu przy czerwonym
      # CI, trzy warunki):
      #   a) git add dotyczy WYLACZNIE tych dwoch plikow (nie -A/.) - juz tak
      #      bylo, niezmienione tutaj.
      #   b) prefiks komunikatu jednoznacznie oznacza zapis STANU CI (nie
      #      zmiany programistycznej) i jest RÓZNY dla przebiegu udanego
      #      ("ci-status(ok):") i nieudanego ("ci-status(red):") - wybrany na
      #      podstawie JOB_STATUS (ten sam ${{ job.status }} co w kroku "Write
      #      reports/status.json" powyzej). Dyrektywa pominiecia CI jest tu
      #      uzyta FUNKCJONALNIE (patrz c) - nie opisana/zacytowana w czesci
      #      opisowej zadnego z dwoch komunikatow (BRIEF 5.1).
      #   c) mechanizm blokujacy kolejny przebieg: naciwny "[skip ci]" GitHuba
      #      (rozpoznawany w tresci komunikatu commita PRZEZ SAM GITHUB przy
      #      evaluacji zdarzenia push, PRZED odpaleniem jakiegokolwiek joba -
      #      nie jest to logika w tym pliku ani w zadnym skrypcie). Dziala
      #      identycznie niezaleznie od tego, czy PRZEBIEG KTORY GO WPISAL byl
      #      zielony czy czerwony - to jest wlasciwosc TRESCI commita, nie
      #      wyniku joba. `on: push` (linia 4) nie ma dodatkowych filtrow
      #      po statusie, ktore mogłyby to zmienic.
      - name: Commit status.json and artifacts_index.json
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/v0.7.2-scientific-integrity'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/status.json reports/artifacts_index.json
          if [ "$JOB_STATUS" = "success" ]; then
            COMMIT_MSG="ci-status(ok): stan po udanym przebiegu [skip ci]"
          else
            COMMIT_MSG="ci-status(red): stan po nieudanym przebiegu (patrz tests.status w reports/status.json) [skip ci]"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
            git push
          else
            echo "reports/status.json i reports/artifacts_index.json bez zmian, pomijam commit"
          fi
